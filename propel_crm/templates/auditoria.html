<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Auditoria Digital 360 — Propel Agentes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --motion-ease: cubic-bezier(0.16, 1, 0.3, 1);
            --motion-fast: 160ms;
            --motion-normal: 280ms;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
        }
        .smooth-transition {
            transition: all var(--motion-fast) var(--motion-ease);
        }
        /* Badges de Nível */
        .badge-facil { background-color: #ECFDF5; color: #047857; border: 1px solid #A7F3D0; }
        .badge-intermediario { background-color: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; }
        .badge-avancado { background-color: #FAF5FF; color: #7E22CE; border: 1px solid #E9D5FF; }
        
        /* Badges de Importância */
        .badge-muito-alta { background-color: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }
        .badge-alta { background-color: #FFFBEB; color: #B45309; border: 1px solid #FDE68A; }
        .badge-media { background-color: #F1F5F9; color: #475569; border: 1px solid #E2E8F0; }

        /* Estágios */
        .select-concluido { background-color: #ECFDF5; color: #065F46; font-weight: 600; }
        .select-avaliando { background-color: #EFF6FF; color: #1E40AF; font-weight: 600; }
        .select-andamento { background-color: #FFFBEB; color: #92400E; font-weight: 600; }
        .select-pendente { background-color: #FEF2F2; color: #991B1B; font-weight: 600; }
        .select-nao_aplica { background-color: #F3F4F6; color: #4B5563; font-weight: 500; }

        #toast {
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; font-size: 12px; }
            .print-break { page-break-after: always; }
            .shadow-sm, .shadow-md, .shadow-lg { box-shadow: none !important; }
            .border { border: 1px solid #E2E8F0 !important; }
        }
<body class="min-h-screen flex antialiased bg-slate-50">

    <!-- SIDEBAR UNIFICADA (OCULTA NA IMPRESSÃO) -->
    <div class="no-print shrink-0">
        {% include 'sidebar.html' %}
    </div>

    <div class="flex-1 min-w-0 flex flex-col min-h-screen pb-16">
        <!-- TOAST NOTIFICATION -->
        <div id="toast" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3.5 rounded-xl shadow-2xl flex items-center space-x-3 text-sm font-medium border border-slate-800 pointer-events-none">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toastMsg">Alterações salvas com sucesso!</span>
    </div>

    <!-- CABEÇALHO DO SISTEMA -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
            
            <div class="flex items-center space-x-3.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-600 via-blue-600 to-teal-500 flex items-center justify-center text-white shadow-md shadow-indigo-100">
                    <i class="fa-solid fa-chart-pie text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="text-lg font-black tracking-tight text-slate-900">Auditor Digital 360</h1>
                        <span class="px-2 py-0.5 text-[11px] font-bold uppercase tracking-wider rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                            <i class="fa-solid fa-database text-[10px] mr-1"></i>Servidor Propel Conectado
                        </span>
                    </div>
                    <p class="text-xs text-slate-500 font-medium">Auditoria Executiva Integrada ao CRM • Instagram, Google Meu Negócio e Site</p>
                </div>
            </div>

            <!-- SELETOR DINÂMICO DE CLIENTES / LEADS DO BANCO SQLITE -->
            <div class="flex flex-wrap items-center gap-2.5">
                
                <!-- SELETOR DE CLIENTE VINCULADO -->
                <div class="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 flex items-center space-x-2 text-xs">
                    <i class="fa-solid fa-users text-slate-400"></i>
                    <span class="text-slate-500 font-medium">Vincular:</span>
                    <select id="selectClienteBanco" onchange="selecionarClienteDoBanco(this.value)" class="bg-transparent font-bold text-slate-800 focus:outline-none max-w-[210px] truncate cursor-pointer">
                        <option value="">-- Selecione ou Avulso --</option>
                        
                        {% if clientes_trafego %}
                        <optgroup label="💼 Clientes de Tráfego Ativo">
                            {% for c in clientes_trafego %}
                            <option value="cliente_{{ c.id }}" data-tipo="cliente" data-id="{{ c.id }}" data-nome="{{ c.nome_empresa }}" data-wpp="{{ c.whatsapp }}" {% if cliente_id_selecionado == c.id %}selected{% endif %}>
                                {{ c.nome_empresa }}
                            </option>
                            {% endfor %}
                        </optgroup>
                        {% endif %}

                        {% if leads %}
                        <optgroup label="🎯 Leads do Pipeline Comercial">
                            {% for l in leads %}
                            <option value="lead_{{ l.id }}" data-tipo="lead" data-id="{{ l.id }}" data-nome="{{ l.nome }}" data-wpp="{{ l.whatsapp }}" data-ig="{{ l.instagram }}" data-url="{{ l.url }}" {% if lead_id_selecionado == l.id %}selected{% endif %}>
                                {{ l.nome }} ({{ l.cidade }})
                            </option>
                            {% endfor %}
                        </optgroup>
                        {% endif %}
                    </select>
                </div>

                <div class="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 flex items-center space-x-1.5 text-xs">
                    <span class="text-slate-500 font-medium">Empresa:</span>
                    <input type="text" id="clienteNome" value="Passeios Ilha Eco & Náutica" onchange="salvarMetadados()" class="bg-transparent font-bold text-slate-800 focus:outline-none w-44 truncate">
                </div>

                <!-- BOTÃO SALVAR NO SERVIDOR PROPEL (SQLITE) -->
                <button onclick="salvarNoServidorPropel()" id="btnSalvarServidor" class="inline-flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-lg text-xs font-bold shadow-sm hover:shadow transition cursor-pointer">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Salvar no Banco</span>
                </button>

                <!-- AÇÕES RÁPIDAS -->
                <button onclick="abrirModalWhatsApp()" class="inline-flex items-center space-x-1 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-bold shadow-sm transition cursor-pointer" title="Gerar abordagem comercial">
                    <i class="fa-brands fa-whatsapp text-sm"></i>
                    <span>WhatsApp</span>
                </button>

                <button onclick="window.print()" class="inline-flex items-center space-x-1 bg-slate-800 hover:bg-slate-900 text-white px-2.5 py-2 rounded-lg text-xs font-semibold shadow-sm transition cursor-pointer" title="Imprimir laudo executivo">
                    <i class="fa-solid fa-print"></i>
                    <span>PDF</span>
                </button>

                <button onclick="exportarCSVAtual()" class="inline-flex items-center space-x-1 bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 px-2.5 py-2 rounded-lg text-xs font-semibold shadow-sm transition cursor-pointer" title="Exportar no modelo de planilha">
                    <i class="fa-solid fa-file-csv text-emerald-600"></i>
                    <span>CSV</span>
                </button>

                <!-- NAVEGAÇÃO DE VOLTA AO CRM -->
                <a href="/" class="inline-flex items-center space-x-1 bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 px-2.5 py-2 rounded-lg text-xs font-bold transition">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i>
                    <span>CRM</span>
                </a>
                <a href="/trafego" class="inline-flex items-center space-x-1 bg-purple-50 hover:bg-purple-100 border border-purple-200 text-purple-700 px-2.5 py-2 rounded-lg text-xs font-bold transition">
                    <i class="fa-solid fa-bolt text-[10px]"></i>
                    <span>Tráfego</span>
                </a>
            </div>
        </div>
    </header>

    <!-- BARRA DE KPIS & SCORE DE SAÚDE DIGITAL -->
    <div class="bg-white border-b border-slate-200 py-4 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-2 md:grid-cols-6 gap-3 sm:gap-4 items-center">
                
                <!-- NOTA GERAL -->
                <div class="col-span-2 bg-gradient-to-r from-slate-900 to-indigo-950 text-white p-4 rounded-xl shadow-md flex items-center justify-between">
                    <div>
                        <span class="text-[11px] font-bold text-indigo-300 uppercase tracking-wider block">Nota de Saúde Digital</span>
                        <div class="flex items-baseline space-x-2 mt-0.5">
                            <span id="scoreGeralNota" class="text-3xl font-black tracking-tight text-white">--</span>
                            <span class="text-xs text-indigo-300 font-medium">/ 10</span>
                        </div>
                        <span id="scoreGeralStatus" class="inline-block mt-1 text-[11px] font-semibold px-2 py-0.5 rounded-md bg-white/10 text-emerald-300">Calculando...</span>
                    </div>
                    <div class="w-14 h-14 rounded-full border-4 border-indigo-500/30 flex items-center justify-center relative">
                        <i class="fa-solid fa-award text-2xl text-amber-400"></i>
                    </div>
                </div>

                <!-- PROGRESSO CONCLUÍDO -->
                <div class="bg-emerald-50/70 border border-emerald-200 p-3.5 rounded-xl">
                    <span class="text-[11px] font-bold text-emerald-800 uppercase tracking-wider block">Concluídos</span>
                    <div class="flex items-baseline space-x-1.5 mt-1">
                        <span id="kpiConcluidos" class="text-2xl font-black text-emerald-700">0</span>
                        <span id="kpiConcluidosPct" class="text-xs font-semibold text-emerald-600">(0%)</span>
                    </div>
                    <div class="w-full bg-emerald-200 rounded-full h-1.5 mt-2 overflow-hidden">
                        <div id="barConcluidos" class="bg-emerald-500 h-1.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>

                <!-- EM ANDAMENTO -->
                <div class="bg-amber-50/70 border border-amber-200 p-3.5 rounded-xl">
                    <span class="text-[11px] font-bold text-amber-800 uppercase tracking-wider block">Em Andamento</span>
                    <div class="flex items-baseline space-x-1.5 mt-1">
                        <span id="kpiAndamento" class="text-2xl font-black text-amber-700">0</span>
                        <span id="kpiAndamentoPct" class="text-xs font-semibold text-amber-600">(0%)</span>
                    </div>
                    <div class="w-full bg-amber-200 rounded-full h-1.5 mt-2 overflow-hidden">
                        <div id="barAndamento" class="bg-amber-500 h-1.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>

                <!-- AVALIANDO -->
                <div class="bg-blue-50/70 border border-blue-200 p-3.5 rounded-xl">
                    <span class="text-[11px] font-bold text-blue-800 uppercase tracking-wider block">Avaliando</span>
                    <div class="flex items-baseline space-x-1.5 mt-1">
                        <span id="kpiAvaliando" class="text-2xl font-black text-blue-700">0</span>
                        <span id="kpiAvaliandoPct" class="text-xs font-semibold text-blue-600">(0%)</span>
                    </div>
                    <div class="w-full bg-blue-200 rounded-full h-1.5 mt-2 overflow-hidden">
                        <div id="barAvaliando" class="bg-blue-500 h-1.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>

                <!-- PENDENTE / GARGALOS -->
                <div class="bg-rose-50/70 border border-rose-200 p-3.5 rounded-xl">
                    <span class="text-[11px] font-bold text-rose-800 uppercase tracking-wider block">Gargalos / Pendentes</span>
                    <div class="flex items-baseline space-x-1.5 mt-1">
                        <span id="kpiPendentes" class="text-2xl font-black text-rose-700">0</span>
                        <span id="kpiPendentesPct" class="text-xs font-semibold text-rose-600">(0%)</span>
                    </div>
                    <div class="w-full bg-rose-200 rounded-full h-1.5 mt-2 overflow-hidden">
                        <div id="barPendentes" class="bg-rose-500 h-1.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- CORPO PRINCIPAL: ABAS, TABELA INTERATIVA E FILTROS -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- NAVEGAÇÃO DE ABAS -->
        <div class="flex flex-wrap items-center justify-between border-b border-slate-200 pb-3 gap-3 no-print">
            <nav class="flex space-x-2" aria-label="Tabs">
                <button onclick="mudarAba('instagram')" id="tabBtn_instagram" class="tab-btn px-4 py-2.5 rounded-xl font-bold text-sm flex items-center space-x-2 bg-pink-500 text-white shadow-sm transition">
                    <i class="fa-brands fa-instagram text-base"></i>
                    <span>Instagram</span>
                    <span id="badgeTab_instagram" class="ml-1 text-xs px-2 py-0.5 rounded-full bg-white/25 text-white">0%</span>
                </button>

                <button onclick="mudarAba('google')" id="tabBtn_google" class="tab-btn px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center space-x-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">
                    <i class="fa-brands fa-google text-base text-blue-600"></i>
                    <span>Google Meu Negócio</span>
                    <span id="badgeTab_google" class="ml-1 text-xs px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">0%</span>
                </button>

                <button onclick="mudarAba('site')" id="tabBtn_site" class="tab-btn px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center space-x-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">
                    <i class="fa-solid fa-globe text-base text-teal-600"></i>
                    <span>Análise de Site</span>
                    <span id="badgeTab_site" class="ml-1 text-xs px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">0%</span>
                </button>

                <button onclick="mudarAba('consolidado')" id="tabBtn_consolidado" class="tab-btn px-4 py-2.5 rounded-xl font-semibold text-sm flex items-center space-x-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">
                    <i class="fa-solid fa-clipboard-check text-base text-indigo-600"></i>
                    <span>Laudo Consolidado</span>
                </button>
            </nav>

            <!-- FILTROS E PESQUISA -->
            <div class="flex items-center space-x-2 text-xs">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400"></i>
                    <input type="text" id="filtroTexto" oninput="aplicarFiltros()" placeholder="Filtrar critério..." class="pl-8 pr-3 py-1.5 bg-white border border-slate-200 rounded-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-indigo-500 w-44">
                </div>

                <select id="filtroNivel" onchange="aplicarFiltros()" class="bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-700 font-medium focus:outline-none">
                    <option value="TODOS">Todos Níveis</option>
                    <option value="Fácil">Fácil</option>
                    <option value="Intermediário">Intermediário</option>
                    <option value="Avançado">Avançado</option>
                </select>

                <select id="filtroImportancia" onchange="aplicarFiltros()" class="bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-700 font-medium focus:outline-none">
                    <option value="TODOS">Todas Importâncias</option>
                    <option value="Muito alta">Muito alta</option>
                    <option value="Alta">Alta</option>
                    <option value="Média">Média</option>
                </select>

                <select id="filtroEstagio" onchange="aplicarFiltros()" class="bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-700 font-medium focus:outline-none">
                    <option value="TODOS">Todos Estágios</option>
                    <option value="Concluído">Concluído</option>
                    <option value="Em Andamento">Em Andamento</option>
                    <option value="Avaliando">Avaliando</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Não se Aplica">Não se Aplica</option>
                </select>

                <button onclick="marcarTodosAba('Concluído')" title="Aprovar todos os critérios visíveis" class="bg-slate-100 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 px-2.5 py-1.5 rounded-lg font-semibold border border-slate-200 transition">
                    <i class="fa-solid fa-check-double text-emerald-600 mr-1"></i>Concluir Todos
                </button>
            </div>
        </div>

        <!-- CONTAINER DA TABELA DE AUDITORIA (INSTAGRAM, GOOGLE, SITE) -->
        <div id="containerTabela" class="mt-5 space-y-6">
            <!-- Renderizado dinamicamente via JS -->
        </div>

        <!-- CONTAINER DA VISÃO CONSOLIDADA -->
        <div id="containerConsolidado" class="mt-5 hidden space-y-6">
            <!-- Renderizado dinamicamente via JS -->
        </div>

    </main>

    <!-- MODAL DE DIAGNÓSTICO WHATSAPP -->
    <div id="modalWhatsApp" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden no-print">
        <div class="bg-white rounded-2xl max-w-xl w-full shadow-2xl overflow-hidden border border-slate-100 flex flex-col max-h-[90vh]">
            <div class="bg-emerald-600 px-6 py-4 flex items-center justify-between text-white">
                <div class="flex items-center space-x-2.5">
                    <i class="fa-brands fa-whatsapp text-2xl"></i>
                    <div>
                        <h3 class="font-bold text-base">Diagnóstico Pronto para WhatsApp</h3>
                        <p class="text-xs text-emerald-100">Mensagem persuasiva com os pontos críticos encontrados na auditoria</p>
                    </div>
                </div>
                <button onclick="fecharModalWhatsApp()" class="text-white/80 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="p-6 flex-1 overflow-y-auto space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Telefone WhatsApp do Cliente:</label>
                    <input type="text" id="waTelefone" placeholder="5512999999999" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Texto Gerado:</label>
                    <textarea id="waTexto" rows="11" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs font-mono text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                </div>
            </div>

            <div class="bg-slate-50 px-6 py-3.5 border-t border-slate-200 flex items-center justify-between">
                <button onclick="fecharModalWhatsApp()" class="text-xs font-semibold text-slate-600 hover:text-slate-800">Cancelar</button>
                <div class="flex items-center space-x-2">
                    <button onclick="copiarTextoWhatsApp()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-xs font-bold shadow transition">
                        <i class="fa-regular fa-copy mr-1.5"></i>Copiar Mensagem
                    </button>
                    <button onclick="enviarWhatsAppDireto()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-bold shadow transition">
                        <i class="fa-brands fa-whatsapp mr-1.5"></i>Abrir WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS DO SISTEMA -->
    <script>

        function selecionarClienteDoBanco(valor) {

            if (!opt) return;

            const tipo = opt.getAttribute('data-tipo');
            const id = opt.getAttribute('data-id');
            const nome = opt.getAttribute('data-nome');
            const wpp = opt.getAttribute('data-wpp');

            document.getElementById('clienteNome').value = nome || '';

            if (tipo === 'lead') {
                leadIdAtivo = parseInt(id);

                leadIdAtivo = null;
                carregarAuditoriaDoServidor(null, clienteTrafegoIdAtivo);
            }
        }

        async function carregarAuditoriaDoServidor(leadId, clienteId) {
            try {
                let url = '/api/auditoria/obter?';
                if (leadId) url += `lead_id=${leadId}`;
                else if (clienteId) url += `cliente_id=${clienteId}`;

                const res = await fetch(url);

                if (data.encontrado && data.auditoria && data.auditoria.dados) {
                    dadosAuditoria = data.auditoria.dados;
                    mostrarToast(`Auditoria do banco carregada para ${document.getElementById('clienteNome').value}!`);
                    atualizarInterface();
                } else {

                score_site: nSite,

            };

            try {
                const res = await fetch('/api/auditoria/salvar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if (result.sucesso) {
                    mostrarToast("✅ Salvo com sucesso no Banco SQLite do Servidor Propel!");

                    mostrarToast("Aviso: Salvo localmente no navegador!");

        function calcularMetricas() {
            let total = 0;
            let concluidos = 0;
            let andamento = 0;
            let avaliando = 0;
            let pendentes = 0;
            let pontuacaoTotal = 0;
            let maxPontos = 0;

            const pesos = { 'Muito alta': 3, 'Alta': 2, 'Média': 1 };

            ['instagram', 'google', 'site'].forEach(modulo => {
                let modTotal = 0;
                let modConcluido = 0;

                dadosAuditoria[modulo].secoes.forEach(sec => {
                    sec.itens.forEach(item => {
                        total++;
                        modTotal++;
                        const peso = pesos[item.importancia] || 1;
                        maxPontos += peso;

                        if (item.estagio === 'Concluído') {
                            concluidos++;
                            modConcluido++;
                            pontuacaoTotal += peso;
                        } else if (item.estagio === 'Em Andamento') {
                            andamento++;
                            pontuacaoTotal += (peso * 0.5);
                        } else if (item.estagio === 'Avaliando') {
                            avaliando++;
                        } else if (item.estagio === 'Pendente') {
                            pendentes++;
                        } else if (item.estagio === 'Não se Aplica') {
                            maxPontos -= peso;
                        }
                    });
                });

                const modPct = modTotal > 0 ? Math.round((modConcluido / modTotal) * 100) : 0;
                const badge = document.getElementById(`badgeTab_${modulo}`);
                if (badge) badge.innerText = `${modPct}%`;
            });

            const pctConcluido = total > 0 ? Math.round((concluidos / total) * 100) : 0;
            const pctAndamento = total > 0 ? Math.round((andamento / total) * 100) : 0;
            const pctAvaliando = total > 0 ? Math.round((avaliando / total) * 100) : 0;
            const pctPendente = total > 0 ? Math.round((pendentes / total) * 100) : 0;

            document.getElementById('kpiConcluidos').innerText = concluidos;
            document.getElementById('kpiConcluidosPct').innerText = `(${pctConcluido}%)`;
            document.getElementById('barConcluidos').style.width = `${pctConcluido}%`;

            document.getElementById('kpiAndamento').innerText = andamento;
            document.getElementById('kpiAndamentoPct').innerText = `(${pctAndamento}%)`;
            document.getElementById('barAndamento').style.width = `${pctAndamento}%`;

            document.getElementById('kpiAvaliando').innerText = avaliando;
            document.getElementById('kpiAvaliandoPct').innerText = `(${pctAvaliando}%)`;
            document.getElementById('barAvaliando').style.width = `${pctAvaliando}%`;

            document.getElementById('kpiPendentes').innerText = pendentes;
            document.getElementById('kpiPendentesPct').innerText = `(${pctPendente}%)`;
            document.getElementById('barPendentes').style.width = `${pctPendente}%`;

            const notaCalculada = maxPontos > 0 ? ((pontuacaoTotal / maxPontos) * 10).toFixed(1) : "0.0";
            document.getElementById('scoreGeralNota').innerText = notaCalculada;

            const statusEl = document.getElementById('scoreGeralStatus');
            const n = parseFloat(notaCalculada);
            if (n >= 8.5) {
                statusEl.innerText = "Excelente / Referência de Mercado";
                statusEl.className = "inline-block mt-1 text-[11px] font-semibold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300";
            } else if (n >= 6.5) {
                statusEl.innerText = "Bom / Oportunidades Claras";
                statusEl.className = "inline-block mt-1 text-[11px] font-semibold px-2 py-0.5 rounded-md bg-blue-500/20 text-blue-300";
            } else if (n >= 4.5) {
                statusEl.innerText = "Regular / Gargalos de Conversão";
                statusEl.className = "inline-block mt-1 text-[11px] font-semibold px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300";
            } else {
                statusEl.innerText = "Crítico / Perda Ativa de Vendas";
                statusEl.className = "inline-block mt-1 text-[11px] font-semibold px-2 py-0.5 rounded-md bg-rose-500/20 text-rose-300";
            }
        }

                    rows.push([sec.nome, "", "", "", "", ""]);
                    sec.itens.forEach(item => {
                        rows.push([item.item, item.referencia || "Referência", item.nivel, item.importancia, item.estagio, item.obs || ""]);
                    });
                });
                rows.push(["", "", "", "", "", ""]);
            });

            let csvContent = "﻿";
            rows.forEach(r => {
                csvContent += r.map(c => `"${(c || '').toString().replace(/"/g, '""')}"`).join(",") + "\r\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `auditoria_${document.getElementById('clienteNome').value.replace(/\s+/g, '_').toLowerCase()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function abrirModalWhatsApp() {
            const cliente = document.getElementById('clienteNome').value;
            const auditor = 'Especialista Propel';
            const score = document.getElementById('scoreGeralNota').innerText;

            const igErros = dadosAuditoria.instagram.complementares.erros;
            const gmbErros = dadosAuditoria.google.complementares.erros;
            const siteErros = dadosAuditoria.site.complementares.erros;

            const texto = `*Diagnóstico de Presença Digital — ${cliente}* 🚀\n\n` +
                          `Olá! Aqui é o ${auditor}. Acabamos de rodar a auditoria técnica completa dos seus canais de atração (Instagram, Google Meu Negócio e Site).\n\n` +
                          `📊 *Sua Nota de Saúde Digital atual:* *${score} / 10*\n\n` +
                          `Identificamos 3 pontos imediatos onde você pode estar perdendo clientes qualificados:\n` +
                          `1️⃣ *Instagram:* ${igErros}\n` +
                          `2️⃣ *Google Maps:* ${gmbErros}\n` +
                          `3️⃣ *Site Oficial:* ${siteErros}\n\n` +
                          `Preparamos um plano de ação simples de 7 dias para corrigir esses gargalos e aumentar a conversão de novos clientes pelo WhatsApp.\n\n` +
                          `Podemos agendar 15 minutos amanhã para te apresentar os detalhes?`;

            document.getElementById('waTexto').value = texto;
            document.getElementById('modalWhatsApp').classList.remove('hidden');
        }

        function fecharModalWhatsApp() {
            document.getElementById('modalWhatsApp').classList.add('hidden');
        }

        function copiarTextoWhatsApp() {
            const el = document.getElementById('waTexto');
            el.select();
            document.execCommand('copy');
            mostrarToast("Texto copiado para a área de transferência!");
        }

        function enviarWhatsAppDireto() {
            let fone = document.getElementById('waTelefone').value.replace(/\D/g, '');
            const texto = encodeURIComponent(document.getElementById('waTexto').value);
            if (!fone) fone = "";
            window.open(`https://wa.me/${fone}?text=${texto}`, '_blank');
        }
    </script>
